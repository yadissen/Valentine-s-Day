<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Our Love Story ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Great+Vibes&family=Cinzel:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-rose: #ff6b9d;
            --secondary-rose: #c44569;
            --gold: #f9ca24;
            --cream: #fff5e6;
            --dark: #2c3e50;
            --shadow: rgba(0, 0, 0, 0.15);
            --glow: rgba(255, 107, 157, 0.4);
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Enhanced Theme Backgrounds */
        body.theme-romantic {
            background:
                radial-gradient(circle at 20% 50%, rgba(255, 107, 157, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(196, 69, 105, 0.15) 0%, transparent 50%),
                linear-gradient(135deg, #ffecd2 0%, #fcb69f 25%, #ff9a9e 50%, #fad0c4 75%, #ffecd2 100%);
            background-size: 100% 100%, 100% 100%, 400% 400%;
            animation: gradientShift 20s ease infinite;
        }

        body.theme-rose-gold {
            background:
                radial-gradient(circle at 30% 20%, rgba(249, 202, 36, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 70% 70%, rgba(255, 107, 157, 0.1) 0%, transparent 50%),
                linear-gradient(135deg, #f6d365 0%, #fda085 20%, #fa709a 40%, #fee140 60%, #f093fb 80%, #fda085 100%);
            background-size: 100% 100%, 100% 100%, 400% 400%;
            animation: gradientShift 20s ease infinite;
        }

        body.theme-midnight {
            background:
                radial-gradient(circle at 40% 40%, rgba(255, 107, 157, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 70% 70%, rgba(102, 126, 234, 0.08) 0%, transparent 50%),
                linear-gradient(135deg, #0f2027 0%, #203a43 25%, #2c5364 50%, #1a2a6c 75%, #0f2027 100%);
            background-size: 100% 100%, 100% 100%, 400% 400%;
            animation: gradientShift 20s ease infinite;
        }

        body.theme-vintage {
            background:
                radial-gradient(circle at 25% 25%, rgba(212, 163, 115, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(163, 125, 94, 0.2) 0%, transparent 50%),
                linear-gradient(135deg, #d4a373 0%, #c39e81 25%, #b6916d 50%, #a37d5e 75%, #d4a373 100%);
            background-size: 100% 100%, 100% 100%, 400% 400%;
            animation: gradientShift 20s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 0%, 0% 0%, 0% 50%; }
            50% { background-position: 0% 0%, 0% 0%, 100% 50%; }
        }

        /* Premium Loader */
        .loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .loader-wrapper.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader-content {
            text-align: center;
        }

        .loader-heart {
            font-size: 4rem;
            animation: heartbeat 1.5s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.2); }
            50% { transform: scale(1); }
        }

        .loader-text {
            font-family: 'Alex Brush', cursive;
            font-size: 2.5rem;
            color: #c44569;
            margin-top: 20px;
            animation: fadeInOut 2s ease infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Enhanced Particle System */
        .particles-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .particle {
            position: absolute;
            opacity: 0;
            will-change: transform, opacity;
        }

        .particle.heart {
            font-size: 24px;
            animation: floatHeart 15s infinite;
            filter: drop-shadow(0 0 8px rgba(255, 107, 157, 0.6));
        }

        .particle.petal {
            width: 12px;
            height: 12px;
            background: radial-gradient(ellipse at center, rgba(255, 182, 193, 0.9) 0%, rgba(255, 107, 157, 0.6) 100%);
            border-radius: 50% 0 50% 0;
            animation: floatPetal 12s infinite;
            box-shadow: 0 0 10px rgba(255, 182, 193, 0.4);
        }

        .particle.sparkle {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.95);
            animation: floatSparkle 10s infinite;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% { opacity: 0.9; }
            90% { opacity: 0.7; }
            100% {
                transform: translateY(-10vh) rotate(360deg) scale(1);
                opacity: 0;
            }
        }

        @keyframes floatPetal {
            0% {
                transform: translateY(100vh) rotate(0deg) translateX(0);
                opacity: 0;
            }
            10% { opacity: 0.8; }
            50% { transform: translateY(50vh) rotate(180deg) translateX(100px); }
            90% { opacity: 0.6; }
            100% {
                transform: translateY(-10vh) rotate(360deg) translateX(-50px);
                opacity: 0;
            }
        }

        @keyframes floatSparkle {
            0% {
                transform: translateY(100vh) scale(0) rotate(0deg);
                opacity: 0;
            }
            15% { opacity: 1; }
            85% { opacity: 0.8; }
            100% {
                transform: translateY(-10vh) scale(1.5) rotate(180deg);
                opacity: 0;
            }
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 60px 30px;
            position: relative;
            z-index: 2;
        }

        /* Elegant Header */
        .header {
            text-align: center;
            margin-bottom: 70px;
            animation: fadeInDown 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .header::before,
        .header::after {
            content: '♥';
            position: absolute;
            font-size: 2rem;
            color: rgba(255, 107, 157, 0.3);
            animation: pulse 2s ease infinite;
        }

        .header::before {
            left: 10%;
            top: 20%;
        }

        .header::after {
            right: 10%;
            top: 20%;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.2); opacity: 0.6; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            font-family: 'Alex Brush', cursive;
            font-size: 6rem;
            background: linear-gradient(135deg, #c44569 0%, #ff6b9d 50%, #f9ca24 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            display: inline-block;
            filter: drop-shadow(3px 3px 6px rgba(196, 69, 105, 0.3));
        }

        .header h1:hover {
            transform: scale(1.05) rotate(-2deg);
            filter: drop-shadow(5px 5px 15px rgba(196, 69, 105, 0.5));
        }

        .header h1.editing {
            outline: 3px dashed rgba(255, 107, 157, 0.4);
            padding: 15px 30px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .header p {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: rgba(44, 62, 80, 0.8);
            font-style: italic;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
            padding: 8px 20px;
            position: relative;
        }

        .header p::before {
            content: '"';
            position: absolute;
            left: -10px;
            top: -10px;
            font-size: 3rem;
            color: rgba(255, 107, 157, 0.3);
            font-family: Georgia, serif;
        }

        .header p::after {
            content: '"';
            position: absolute;
            right: -10px;
            bottom: -25px;
            font-size: 3rem;
            color: rgba(255, 107, 157, 0.3);
            font-family: Georgia, serif;
        }

        .header p:hover {
            transform: scale(1.03);
            color: rgba(44, 62, 80, 1);
        }

        .header p.editing {
            outline: 2px dashed rgba(255, 107, 157, 0.4);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        /* Premium Toolbar */
        .toolbar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 50px;
            flex-wrap: wrap;
            animation: fadeIn 1.2s ease 0.4s backwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .toolbar-group {
            display: flex;
            gap: 12px;
            align-items: center;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            padding: 15px 30px;
            border-radius: 60px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }

        .toolbar-group:hover {
            transform: translateY(-3px);
            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .toolbar-label {
            color: rgba(44, 62, 80, 0.9);
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
        }

        .theme-btn, .filter-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .theme-btn::before, .filter-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.4s ease, height 0.4s ease;
        }

        .theme-btn:hover::before, .filter-btn:hover::before {
            width: 100%;
            height: 100%;
        }

        .theme-btn:hover, .filter-btn:hover {
            transform: scale(1.2) rotate(10deg);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .theme-btn.active, .filter-btn.active {
            transform: scale(1.25);
            border-color: white;
            box-shadow:
                0 0 0 4px rgba(255, 107, 157, 0.3),
                0 0 30px rgba(255, 107, 157, 0.5),
                0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .theme-romantic { background: linear-gradient(135deg, #ff9a9e, #fad0c4, #ffecd2); }
        .theme-rose-gold { background: linear-gradient(135deg, #f6d365, #fda085, #fa709a); }
        .theme-midnight { background: linear-gradient(135deg, #2c5364, #203a43, #0f2027); }
        .theme-vintage { background: linear-gradient(135deg, #d4a373, #c39e81, #8b7355); }

        .filter-none { background: linear-gradient(135deg, #ffffff, #f0f0f0); }
        .filter-vintage { background: linear-gradient(135deg, #d4a373, #8b7355); }
        .filter-romantic { background: linear-gradient(135deg, #ffb3ba, #ff6b9d); }
        .filter-dreamy { background: linear-gradient(135deg, #c3cfe2, #a8d0e6, #f8b500); }

        /* Premium Album Grid */
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 60px;
            margin-bottom: 80px;
            perspective: 1000px;
        }

        /* Spectacular Photo Cards */
        .photo-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(30px);
            border-radius: 30px;
            padding: 40px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.15),
                0 0 0 1px rgba(255, 255, 255, 0.5) inset,
                0 0 40px rgba(255, 107, 157, 0.1);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeInUp 1s cubic-bezier(0.4, 0, 0.2, 1) backwards;
            position: relative;
            overflow: visible;
            cursor: move;
            transform-style: preserve-3d;
        }

        .photo-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg,
                #ff6b9d, #f9ca24, #ff6b9d, #c44569, #ff6b9d);
            background-size: 400% 400%;
            border-radius: 30px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s ease;
            animation: gradientRotate 4s ease infinite;
        }

        @keyframes gradientRotate {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .photo-card:hover::before {
            opacity: 1;
        }

        .photo-card::after {
            content: '♥';
            position: absolute;
            top: -15px;
            right: -15px;
            font-size: 2rem;
            opacity: 0;
            transform: scale(0) rotate(-45deg);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            color: #ff6b9d;
            filter: drop-shadow(0 0 10px rgba(255, 107, 157, 0.6));
        }

        .photo-card:hover::after {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        .photo-card.dragging {
            opacity: 0.7;
            transform: scale(0.95) rotate(5deg);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
        }

        .photo-card.drag-over {
            border: 4px dashed rgba(255, 107, 157, 0.6);
            background: rgba(255, 255, 255, 0.6);
            transform: scale(1.05);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(60px) rotateX(20deg);
            }
            to {
                opacity: 1;
                transform: translateY(0) rotateX(0);
            }
        }

        .photo-card:hover {
            transform: translateY(-15px) scale(1.03);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.25),
                0 0 60px rgba(255, 107, 157, 0.2);
        }

        /* Luxurious Frame Styles */
        .photo-frame {
            width: 100%;
            height: 420px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        /* Love Letter Frame - Vintage letter with wax seal */
        .photo-frame.style-loveletter {
            border: 18px solid #f5e6d3;
            background:
                linear-gradient(135deg, #fff9f0 0%, #f5e6d3 100%);
            box-shadow:
                inset 0 0 60px rgba(139, 89, 42, 0.15),
                0 20px 60px rgba(0, 0, 0, 0.25),
                0 0 0 2px rgba(139, 89, 42, 0.2);
            border-radius: 8px;
            position: relative;
        }

        .photo-frame.style-loveletter::before {
            content: '❤';
            position: absolute;
            top: -35px;
            right: 20px;
            font-size: 3rem;
            background: radial-gradient(circle, #c41e3a, #8b0000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 4px 8px rgba(139, 0, 0, 0.4));
            z-index: 10;
            animation: sealPulse 3s ease-in-out infinite;
        }

        @keyframes sealPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .photo-frame.style-loveletter::after {
            content: '';
            position: absolute;
            top: -8px;
            right: -8px;
            bottom: -8px;
            left: -8px;
            border: 2px dashed rgba(139, 89, 42, 0.3);
            border-radius: 10px;
            pointer-events: none;
        }

        /* Rose Garden Frame - Floral corners with roses */
        .photo-frame.style-rosegarden {
            border: 16px solid #fff;
            background: linear-gradient(135deg, #ffebf0, #ffe0e9);
            box-shadow:
                inset 0 0 40px rgba(255, 105, 180, 0.2),
                0 20px 60px rgba(0, 0, 0, 0.25);
            border-radius: 15px;
            position: relative;
        }

        .photo-frame.style-rosegarden::before {
            content: '🌹';
            position: absolute;
            top: -20px;
            left: -20px;
            font-size: 2.5rem;
            filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.3));
            z-index: 10;
            animation: roseRotate 6s ease-in-out infinite;
        }

        .photo-frame.style-rosegarden::after {
            content: '🌹';
            position: absolute;
            bottom: -20px;
            right: -20px;
            font-size: 2.5rem;
            filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.3));
            z-index: 10;
            transform: rotate(180deg);
            animation: roseRotate 6s ease-in-out infinite reverse;
        }

        @keyframes roseRotate {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(10deg); }
        }

        /* Heart Lace Frame - Delicate lace pattern */
        .photo-frame.style-heartlace {
            border: 20px solid #fff;
            background:
                radial-gradient(circle at 30% 30%, rgba(255, 182, 193, 0.3), transparent),
                linear-gradient(135deg, #fff5f8, #ffe4ec);
            box-shadow:
                inset 0 0 50px rgba(255, 105, 180, 0.15),
                0 20px 60px rgba(0, 0, 0, 0.25);
            position: relative;
            border-radius: 25px;
        }

        .photo-frame.style-heartlace::before {
            content: '';
            position: absolute;
            top: -25px;
            left: -25px;
            right: -25px;
            bottom: -25px;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(255, 105, 180, 0.15) 2px, transparent 2px),
                radial-gradient(circle at 80% 20%, rgba(255, 105, 180, 0.15) 2px, transparent 2px),
                radial-gradient(circle at 20% 80%, rgba(255, 105, 180, 0.15) 2px, transparent 2px),
                radial-gradient(circle at 80% 80%, rgba(255, 105, 180, 0.15) 2px, transparent 2px);
            background-size: 40px 40px;
            border-radius: 30px;
            pointer-events: none;
            border: 3px solid rgba(255, 182, 193, 0.3);
        }

        .photo-frame.style-heartlace::after {
            content: '💕';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem;
            opacity: 0.08;
            pointer-events: none;
        }

        /* Film Memory Frame - Classic film strip */
        .photo-frame.style-filmmemory {
            border: 0;
            background: #1a1a1a;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.4);
            position: relative;
            padding: 30px 15px;
        }

        .photo-frame.style-filmmemory::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                repeating-linear-gradient(
                    to right,
                    transparent 0px,
                    transparent 8px,
                    #1a1a1a 8px,
                    #1a1a1a 10px,
                    #2a2a2a 10px,
                    #2a2a2a 18px,
                    #1a1a1a 18px,
                    #1a1a1a 20px
                ),
                repeating-linear-gradient(
                    to bottom,
                    #2a2a2a 0px,
                    #2a2a2a 25px,
                    #1a1a1a 25px,
                    #1a1a1a 30px
                );
            pointer-events: none;
        }

        .photo-frame.style-filmmemory::after {
            content: '';
            position: absolute;
            top: 30px;
            left: 15px;
            right: 15px;
            bottom: 30px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            pointer-events: none;
        }

        .photo-frame.style-filmmemory img {
            border: 3px solid #2a2a2a;
        }

        .photo-frame:hover {
            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.3),
                0 0 40px rgba(255, 107, 157, 0.2);
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .photo-frame:hover img {
            transform: scale(1.1);
        }

        /* Premium Photo Filters */
        .photo-frame img.filter-vintage {
            filter: sepia(0.6) contrast(1.3) brightness(0.95) saturate(0.8);
        }

        .photo-frame img.filter-romantic {
            filter: saturate(1.4) brightness(1.15) contrast(0.95) hue-rotate(-5deg);
        }

        .photo-frame img.filter-dreamy {
            filter: brightness(1.2) contrast(0.9) saturate(0.85) blur(0.5px) hue-rotate(10deg);
        }

        .photo-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.3) 0%, transparent 70%),
                linear-gradient(135deg, rgba(255, 236, 210, 0.6), rgba(252, 182, 159, 0.6));
            position: relative;
        }

        .photo-placeholder::before {
            content: '';
            position: absolute;
            width: 100px;
            height: 100px;
            border: 3px dashed rgba(196, 69, 105, 0.3);
            border-radius: 50%;
            animation: rotateDash 20s linear infinite;
        }

        @keyframes rotateDash {

        .photo-placeholder span {

        .photo-placeholder p {

        /* Elegant Photo Controls */
        .photo-controls {
            position: absolute;
            top: 15px;
            right: 15px;

            opacity: 0;
            transform: translateY(-10px);

        .photo-card:hover .photo-controls {

        .control-btn {

            align-items: center;

                0 6px 20px rgba(0, 0, 0, 0.2),

            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .control-btn:hover {
            transform: scale(1.2) rotate(10deg);
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            color: white;
            box-shadow:
                0 8px 25px rgba(255, 107, 157, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        /* Frame Style Selector */
        .frame-selector {
            position: absolute;
            bottom: 15px;
            left: 15px;
            display: flex;
            gap: 8px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .photo-card:hover .frame-selector {
            opacity: 1;
            transform: translateY(0);
        }

        .frame-style-btn {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            border: 3px solid white;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .frame-style-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
        }

        .frame-style-btn:hover::before {
            width: 100%;
            height: 100%;
        }

        .frame-style-btn:hover {
            transform: scale(1.15) rotate(5deg);
        }

        .frame-style-btn.active {
            box-shadow:
                0 0 0 3px rgba(255, 107, 157, 0.5),
                0 0 20px rgba(255, 107, 157, 0.6),
                0 4px 15px rgba(0, 0, 0, 0.3);
            transform: scale(1.2);
        }

        .frame-style-btn.loveletter {
            background: linear-gradient(135deg, #fff9f0, #f5e6d3);
            position: relative;
        }
        .frame-style-btn.loveletter::after {
            content: '❤';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1rem;
        }
        .frame-style-btn.rosegarden {
            background: linear-gradient(135deg, #ffebf0, #ffe0e9);
            position: relative;
        }
        .frame-style-btn.rosegarden::after {
            content: '🌹';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1rem;
        }
        .frame-style-btn.heartlace {
            background: linear-gradient(135deg, #fff5f8, #ffe4ec);
            position: relative;
        }
        .frame-style-btn.heartlace::after {
            content: '💕';
            position: absolute;
            top: 50%;
            left: 50%;

        }
        .frame-style-btn.filmmemory {

        .frame-style-btn.filmmemory::after {
            content: '🎞️';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1rem;
        }

        /* Beautiful Caption Area */
        .caption-area {
            margin-top: 25px;
        }

        .caption-area textarea {
            width: 100%;
            border: 3px solid rgba(255, 107, 157, 0.3);
            border-radius: 15px;
            padding: 18px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.15rem;
            resize: vertical;
            min-height: 100px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);

            backdrop-filter: blur(10px);

        }

        .caption-area textarea::placeholder {
            color: rgba(196, 69, 105, 0.5);

        }

        .caption-area textarea:focus {
            outline: none;
            border-color: rgba(255, 107, 157, 0.6);
            background: rgba(255, 255, 255, 0.9);
            box-shadow:
                0 0 30px rgba(255, 107, 157, 0.3),
                0 8px 25px rgba(0, 0, 0, 0.1);
            transform: translateY(-3px);
        }

        .file-input {
            display: none;
        }

        /* Premium Control Buttons */
        .controls {
            text-align: center;
            margin-top: 60px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.2rem;
            font-family: 'Cinzel', serif;
            border-radius: 50px;
            cursor: pointer;
            box-shadow:
                0 8px 30px rgba(255, 107, 157, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        .btn:hover::before {
            width: 400px;
            height: 400px;
        }

        .btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow:
                0 15px 45px rgba(255, 107, 157, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .btn:active {
            transform: translateY(-2px) scale(1.02);
        }

        .btn span {
            position: relative;
            z-index: 1;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            box-shadow:
                0 8px 30px rgba(102, 126, 234, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            box-shadow:
                0 15px 45px rgba(102, 126, 234, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);

        /* Enhanced Notifications */
        .notification {
            position: fixed;
            top: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            color: #2c3e50;
            padding: 20px 35px;
            border-radius: 15px;
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.2),
                0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            font-size: 1.15rem;
            z-index: 10000;
            transform: translateX(500px);
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border-left: 6px solid #ff6b9d;
            font-family: 'Cinzel', serif;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #ff6b9d, #f9ca24);
            border-radius: 15px;
            z-index: -1;
            opacity: 0.1;
        }

        /* Spectacular Lightbox */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            z-index: 99998;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.4s ease;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            position: relative;
            max-width: 95%;
            max-height: 95%;
            animation: zoomIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.3) rotate(-10deg);
                opacity: 0;
            }
            to {
                transform: scale(1) rotate(0);
                opacity: 1;
            }
        }

        .lightbox-content img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 20px;
            box-shadow:
                0 30px 90px rgba(0, 0, 0, 0.6),
                0 0 60px rgba(255, 107, 157, 0.3);
            border: 5px solid rgba(255, 255, 255, 0.1);
        }

        .lightbox-caption {
            text-align: center;
            color: white;
            font-size: 1.6rem;
            font-style: italic;
            margin-top: 25px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            font-family: 'Playfair Display', serif;
        }

        .lightbox-close {
            position: absolute;
            top: -60px;
            right: -60px;
            width: 55px;
            height: 55px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: white;
            font-size: 2.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .lightbox-close:hover {
            background: rgba(255, 107, 157, 0.9);
            border-color: white;
            transform: rotate(90deg) scale(1.15);
            box-shadow: 0 0 30px rgba(255, 107, 157, 0.6);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 65px;
            height: 65px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: white;
            font-size: 2.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .lightbox-nav:hover {
            background: rgba(255, 107, 157, 0.9);
            border-color: white;
            transform: translateY(-50%) scale(1.2);
            box-shadow: 0 0 30px rgba(255, 107, 157, 0.6);
        }

        .lightbox-nav.prev {
            left: 40px;
        }

        .lightbox-nav.next {
            right: 40px;
        }

        /* Slideshow Indicator */
        .slideshow-indicator {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            color: #2c3e50;
            padding: 15px 35px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-family: 'Cinzel', serif;
            z-index: 100000;
            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            display: none;
        }

        .slideshow-indicator.active {
            display: block;
            animation: slideDown 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-150px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .album-grid {
                grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
                gap: 50px;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 4rem;
            }

            .header p {
                font-size: 1.4rem;
            }

            .album-grid {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .toolbar {
                flex-direction: column;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
                padding: 0 20px;
            }

            .btn {
                width: 100%;
            }

            .lightbox-nav {

                height: 55px;
                font-size: 2rem;
            }

            .lightbox-nav.prev {
                left: 15px;
            }

            .lightbox-nav.next {
                right: 15px;
            }

            .lightbox-close {
                top: -50px;
                right: -10px;
            }

            .header::before,
            .header::after {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 3rem;
            }

            .photo-frame {
                height: 320px;
            }

            .photo-card {
                padding: 25px;
            }

            .container {
                padding: 40px 15px;
            }

        /* Print Styles */
        @media print {
            body {
                background: white !important;
            }

            .particles-bg,
            .loader-wrapper,
            .toolbar,
            .controls,
            .notification,
            .photo-controls,
            .frame-selector {
                display: none !important;
            }

            .photo-card {
                page-break-inside: avoid;
                box-shadow: none;
                background: white;
            }

            .photo-card::before,
            .photo-card::after {
                display: none;
            }
        }
    </style>
</head>
<body class="theme-romantic">
    <!-- Premium Loader -->
    <div class="loader-wrapper" id="loader">
        <div class="loader-content">
            <div class="loader-heart">❤️</div>
            <div class="loader-text">Creating Magic...</div>
        </div>
    </div>

    <!-- Enhanced Particles -->
    <div class="particles-bg" id="particlesContainer"></div>

    <!-- Spectacular Lightbox -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-content">
            <div class="lightbox-close" onclick="closeLightbox()">×</div>
            <div class="lightbox-nav prev" onclick="navigateLightbox(-1)">‹</div>
            <div class="lightbox-nav next" onclick="navigateLightbox(1)">›</div>
            <img id="lightboxImage" src="" alt="">
            <div class="lightbox-caption" id="lightboxCaption"></div>
        </div>
    </div>

    <!-- Slideshow Indicator -->
    <div class="slideshow-indicator" id="slideshowIndicator">
        ▶ Slideshow • <span id="slideshowTimer">5</span>s
    </div>

    <!-- Notification -->
    <div class="notification" id="notification"></div>

    <div class="container">
        <!-- Elegant Header -->
        <div class="header">
            <h1 id="albumTitle" contenteditable="false" onclick="editTitle(this)">Our Love Story</h1>
            <p id="albumSubtitle" contenteditable="false" onclick="editTitle(this)">Every moment with you is a treasure ❤️</p>
        </div>

        <!-- Premium Toolbar -->
        <div class="toolbar">
            <div class="toolbar-group">
                <span class="toolbar-label">Themes</span>
                <div class="theme-btn theme-romantic active" onclick="changeTheme('romantic')" title="Romantic Bliss"></div>
                <div class="theme-btn theme-rose-gold" onclick="changeTheme('rose-gold')" title="Rose Gold Elegance"></div>
                <div class="theme-btn theme-midnight" onclick="changeTheme('midnight')" title="Midnight Romance"></div>
                <div class="theme-btn theme-vintage" onclick="changeTheme('vintage')" title="Vintage Love"></div>
            </div>

            <div class="toolbar-group">
                <span class="toolbar-label">Filters</span>
                <div class="filter-btn filter-none active" onclick="changeFilter('none')" title="Original"></div>
                <div class="filter-btn filter-vintage" onclick="changeFilter('vintage')" title="Vintage"></div>
                <div class="filter-btn filter-romantic" onclick="changeFilter('romantic')" title="Romantic"></div>
                <div class="filter-btn filter-dreamy" onclick="changeFilter('dreamy')" title="Dreamy"></div>
            </div>

            <div class="toolbar-group">
                <span class="toolbar-label">💝 <span id="photoCount">0</span> Precious Memories</span>
            </div>
        </div>

        <!-- Premium Album Grid -->
        <div class="album-grid" id="albumGrid">
            <!-- Photo cards will be generated here -->
        </div>

        <!-- Premium Controls -->
        <div class="controls">
            <button class="btn" onclick="addPhotoCard()"><span>➕ Add Memory</span></button>
            <button class="btn" onclick="saveAlbum()"><span>💾 Save Album</span></button>
            <button class="btn btn-secondary" onclick="startSlideshow()"><span>▶ Slideshow</span></button>
            <button class="btn btn-secondary" onclick="exportToPDF()"><span>📥 Export PDF</span></button>
        </div>
    </div>

    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        // Global Variables
        let photoCount = 6;
        let currentTheme = 'romantic';
        let currentFilter = 'none';
        let draggedCard = null;
        let currentLightboxIndex = 0;
        let slideshowInterval = null;
        let slideshowTimer = null;

        // Hide loader on page load
        window.addEventListener('load', function() {
            setTimeout(() => {
                document.getElementById('loader').classList.add('hidden');
            }, 1500);
        });

        // Initialize Album
        function createPhotoCard(index) {
            const delay = index * 0.1;
            return `
                <div class="photo-card" data-index="${index}" draggable="true"
                     ondragstart="handleDragStart(event)"
                     ondragover="handleDragOver(event)"
                     ondrop="handleDrop(event)"
                     ondragend="handleDragEnd(event)"
                     style="animation-delay: ${delay}s">
                    <div class="photo-controls">
                        <button class="control-btn" onclick="deletePhoto(${index})" title="Delete">🗑️</button>
                        <button class="control-btn" onclick="document.getElementById('fileInput${index}').click()" title="Change Photo">📷</button>
                    </div>

                    <div class="frame-selector">
                        <div class="frame-style-btn loveletter active" onclick="changeFrameStyle(${index}, 'loveletter')" title="Love Letter"></div>
                        <div class="frame-style-btn rosegarden" onclick="changeFrameStyle(${index}, 'rosegarden')" title="Rose Garden"></div>
                        <div class="frame-style-btn heartlace" onclick="changeFrameStyle(${index}, 'heartlace')" title="Heart Lace"></div>
                        <div class="frame-style-btn filmmemory" onclick="changeFrameStyle(${index}, 'filmmemory')" title="Film Memory"></div>
                    </div>

                    <div class="photo-frame style-loveletter" id="frame${index}" onclick="openLightbox(${index})">
                        <div class="photo-placeholder" id="placeholder${index}">
                            <span>💝</span>
                            <p>Click to add photo</p>
                        </div>
                        <img id="photo${index}" style="display: none;" />
                    </div>
                    <div class="caption-area">
                        <textarea
                            id="caption${index}"
                            placeholder="Write your precious memory here..."
                            oninput="saveToLocalStorage()"
                        ></textarea>
                    </div>
                    <input type="file" id="fileInput${index}" class="file-input" accept="image/*" onchange="handleImageUpload(${index}, event)">
                </div>
            `;
        }

        function initializeAlbum() {
            const albumGrid = document.getElementById('albumGrid');
            albumGrid.innerHTML = '';

            for (let i = 0; i < photoCount; i++) {
                albumGrid.innerHTML += createPhotoCard(i);
            }

            loadFromLocalStorage();
            updatePhotoCount();
        }

        // Image Upload
        function handleImageUpload(index, event) {
            const file = event.target.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();

                reader.onload = function(e) {
                    const img = document.getElementById(`photo${index}`);
                    const placeholder = document.getElementById(`placeholder${index}`);

                    img.src = e.target.result;
                    img.style.display = 'block';
                    placeholder.style.display = 'none';

                    // Apply current filter
                    img.className = currentFilter !== 'none' ? `filter-${currentFilter}` : '';

                    saveToLocalStorage();
                    updatePhotoCount();
                    showNotification('Photo added! 📸');
                };

                reader.readAsDataURL(file);
            }
        }

        // Delete Photo
        function deletePhoto(index) {
            if (confirm('Are you sure you want to delete this precious memory?')) {
                const img = document.getElementById(`photo${index}`);
                const placeholder = document.getElementById(`placeholder${index}`);
                const caption = document.getElementById(`caption${index}`);

                img.src = '';
                img.style.display = 'none';
                placeholder.style.display = 'flex';
                caption.value = '';

                saveToLocalStorage();
                updatePhotoCount();
                showNotification('Photo removed 🗑️');
            }
        }

        // Frame Styles
        function changeFrameStyle(index, style) {
            const frame = document.getElementById(`frame${index}`);
            frame.className = `photo-frame style-${style}`;

            // Update active button
            const card = frame.closest('.photo-card');
            const buttons = card.querySelectorAll('.frame-style-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            card.querySelector(`.frame-style-btn.${style}`).classList.add('active');

            saveToLocalStorage();
        }

        // Theme Change
        function changeTheme(theme) {
            currentTheme = theme;
            document.body.className = `theme-${theme}`;

            // Update active button
            document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.theme-btn.theme-${theme}`).classList.add('active');

            saveToLocalStorage();
            showNotification(`Theme: ${theme.replace('-', ' ')} ✨`);
        }

        // Filter Change
        function changeFilter(filter) {
            currentFilter = filter;

            // Apply to all photos
            for (let i = 0; i < photoCount; i++) {
                const img = document.getElementById(`photo${i}`);
                if (img && img.style.display !== 'none') {
                    img.className = filter !== 'none' ? `filter-${filter}` : '';
                }
            }

            // Update active button
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.filter-btn.filter-${filter}`).classList.add('active');

            saveToLocalStorage();
            showNotification(`Filter: ${filter} 🎨`);
        }

        // Drag and Drop Reordering
        function handleDragStart(e) {
            draggedCard = e.target.closest('.photo-card');
            e.dataTransfer.effectAllowed = 'move';
            draggedCard.classList.add('dragging');
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';

            const targetCard = e.target.closest('.photo-card');
            if (targetCard && targetCard !== draggedCard) {
                targetCard.classList.add('drag-over');
            }
        }

        function handleDrop(e) {
            e.preventDefault();

            const targetCard = e.target.closest('.photo-card');
            if (targetCard && targetCard !== draggedCard) {
                const albumGrid = document.getElementById('albumGrid');
                const allCards = [...albumGrid.children];
                const draggedIndex = allCards.indexOf(draggedCard);
                const targetIndex = allCards.indexOf(targetCard);

                if (draggedIndex < targetIndex) {
                    targetCard.after(draggedCard);
                } else {
                    targetCard.before(draggedCard);
                }

                reindexCards();
                saveToLocalStorage();
            }

            targetCard?.classList.remove('drag-over');
        }

        function handleDragEnd(e) {
            draggedCard?.classList.remove('dragging');
            document.querySelectorAll('.photo-card').forEach(card => {
                card.classList.remove('drag-over');
            });
        }

        function reindexCards() {
            const cards = document.querySelectorAll('.photo-card');
            cards.forEach((card, newIndex) => {
                card.setAttribute('data-index', newIndex);
            });
        }

        // Lightbox
        function openLightbox(index) {
            const img = document.getElementById(`photo${index}`);
            if (img.style.display === 'none' || !img.src) return;

            currentLightboxIndex = index;
            const caption = document.getElementById(`caption${index}`).value;

            document.getElementById('lightboxImage').src = img.src;
            document.getElementById('lightboxCaption').textContent = caption || '';
            document.getElementById('lightbox').classList.add('active');

            // Apply same filter
            document.getElementById('lightboxImage').className = img.className;
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }

        function navigateLightbox(direction) {
            let newIndex = currentLightboxIndex + direction;

            // Find next valid photo
            while (newIndex >= 0 && newIndex < photoCount) {
                const img = document.getElementById(`photo${newIndex}`);
                if (img && img.style.display !== 'none' && img.src) {
                    openLightbox(newIndex);
                    return;
                }
                newIndex += direction;
            }
        }

        // Close lightbox on ESC key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && document.getElementById('lightbox').classList.contains('active')) {
                closeLightbox();
            }
            if (document.getElementById('lightbox').classList.contains('active')) {
                if (e.key === 'ArrowLeft') navigateLightbox(-1);
                if (e.key === 'ArrowRight') navigateLightbox(1);
            }
        });

        // Slideshow
        function startSlideshow() {
            const photos = [];
            for (let i = 0; i < photoCount; i++) {
                const img = document.getElementById(`photo${i}`);
                if (img && img.style.display !== 'none' && img.src) {
                    photos.push(i);
                }
            }

            if (photos.length === 0) {
                showNotification('Add photos to start slideshow! 📸');
                return;
            }

            let currentSlide = 0;
            openLightbox(photos[currentSlide]);

            document.getElementById('slideshowIndicator').classList.add('active');

            let timeLeft = 5;
            slideshowTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('slideshowTimer').textContent = timeLeft;

                if (timeLeft <= 0) {
                    timeLeft = 5;
                }
            }, 1000);

            slideshowInterval = setInterval(() => {
                currentSlide = (currentSlide + 1) % photos.length;
                openLightbox(photos[currentSlide]);
            }, 5000);

            // Add stop button
            const stopBtn = document.createElement('button');
            stopBtn.innerHTML = '<span>⏹ Stop</span>';
            stopBtn.className = 'btn';
            stopBtn.style.cssText = 'position: fixed; top: 90px; left: 50%; transform: translateX(-50%); z-index: 100001; padding: 12px 30px;';
            stopBtn.onclick = stopSlideshow;
            document.body.appendChild(stopBtn);
        }

        function stopSlideshow() {
            clearInterval(slideshowInterval);
            clearInterval(slideshowTimer);
            document.getElementById('slideshowIndicator').classList.remove('active');
            const stopBtn = document.querySelector('.btn[style*="fixed"]');
            if (stopBtn) stopBtn.remove();
            closeLightbox();
        }

        // Title Editing
        function editTitle(element) {
            element.contentEditable = true;
            element.classList.add('editing');
            element.focus();

            // Select all text
            const range = document.createRange();
            range.selectNodeContents(element);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
        }

        document.addEventListener('click', function(e) {
            const title = document.getElementById('albumTitle');
            const subtitle = document.getElementById('albumSubtitle');

            if (!title.contains(e.target) && title.classList.contains('editing')) {
                title.contentEditable = false;
                title.classList.remove('editing');
                saveToLocalStorage();
            }

            if (!subtitle.contains(e.target) && subtitle.classList.contains('editing')) {
                subtitle.contentEditable = false;
                subtitle.classList.remove('editing');
                saveToLocalStorage();
            }
        });

        // Export to PDF
        async function exportToPDF() {
            showNotification('Generating PDF... ⏳');

            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pageWidth = pdf.internal.pageSize.getWidth();
            const pageHeight = pdf.internal.pageSize.getHeight();

            // Add title
            pdf.setFontSize(32);
            pdf.setFont(undefined, 'bold');
            pdf.text(document.getElementById('albumTitle').textContent, pageWidth / 2, 25, { align: 'center' });

            pdf.setFontSize(16);
            pdf.setFont(undefined, 'italic');
            pdf.text(document.getElementById('albumSubtitle').textContent, pageWidth / 2, 35, { align: 'center' });

            let yPosition = 50;
            let photoAdded = false;

            for (let i = 0; i < photoCount; i++) {
                const img = document.getElementById(`photo${i}`);
                const caption = document.getElementById(`caption${i}`).value;

                if (img && img.style.display !== 'none' && img.src) {
                    if (yPosition > 210) {
                        pdf.addPage();
                        yPosition = 20;
                    }

                    // Add image
                    const imgWidth = 160;
                    const imgHeight = 110;
                    const xPosition = (pageWidth - imgWidth) / 2;

                    try {
                        pdf.addImage(img.src, 'JPEG', xPosition, yPosition, imgWidth, imgHeight);
                        yPosition += imgHeight + 5;

                        // Add caption
                        if (caption) {
                            pdf.setFontSize(12);
                            pdf.setFont(undefined, 'italic');
                            const lines = pdf.splitTextToSize(caption, imgWidth);
                            pdf.text(lines, pageWidth / 2, yPosition, { align: 'center' });
                            yPosition += lines.length * 7 + 20;
                        } else {
                            yPosition += 20;
                        }

                        photoAdded = true;
                    } catch (e) {
                        console.error('Error adding image to PDF:', e);
                    }
                }
            }

            if (photoAdded) {
                pdf.save('Our_Love_Story.pdf');
                showNotification('PDF downloaded! 📥');
            } else {
                showNotification('No photos to export! 📸');
            }
        }

        // Storage Functions
        function saveToLocalStorage() {
            const albumData = {
                photoCount: photoCount,
                theme: currentTheme,
                filter: currentFilter,
                title: document.getElementById('albumTitle').textContent,
                subtitle: document.getElementById('albumSubtitle').textContent,
                photos: []
            };

            const cards = document.querySelectorAll('.photo-card');
            cards.forEach((card, index) => {
                const img = card.querySelector('img');
                const caption = card.querySelector('textarea');
                const frame = card.querySelector('.photo-frame');

                const frameStyle = frame.className.match(/style-(\w+)/)?.[1] || 'loveletter';

                albumData.photos.push({
                    image: img.src,
                    caption: caption ? caption.value : '',
                    frameStyle: frameStyle
                });
            });

            localStorage.setItem('valentinesAlbum', JSON.stringify(albumData));
        }

        function loadFromLocalStorage() {
            const savedData = localStorage.getItem('valentinesAlbum');

            if (savedData) {
                const albumData = JSON.parse(savedData);

                // Restore theme and filter
                if (albumData.theme) changeTheme(albumData.theme);
                if (albumData.filter) changeFilter(albumData.filter);

                // Restore title and subtitle
                if (albumData.title) document.getElementById('albumTitle').textContent = albumData.title;
                if (albumData.subtitle) document.getElementById('albumSubtitle').textContent = albumData.subtitle;

                // Restore photos
                albumData.photos.forEach((photo, index) => {
                    if (index < photoCount) {
                        if (photo.image && photo.image !== '') {
                            const img = document.getElementById(`photo${index}`);
                            const placeholder = document.getElementById(`placeholder${index}`);

                            img.src = photo.image;
                            img.style.display = 'block';
                            placeholder.style.display = 'none';

                            // Apply filter
                            if (currentFilter !== 'none') {
                                img.className = `filter-${currentFilter}`;
                            }
                        }

                        const caption = document.getElementById(`caption${index}`);
                        if (caption && photo.caption) {
                            caption.value = photo.caption;
                        }

                        // Restore frame style
                        if (photo.frameStyle) {
                            changeFrameStyle(index, photo.frameStyle);
                        }
                    }
                });
            }
        }

        function saveAlbum() {
            saveToLocalStorage();
            showNotification('Album saved! 💾✨');
        }

        function addPhotoCard() {
            photoCount++;
            const albumGrid = document.getElementById('albumGrid');
            const newCard = document.createElement('div');
            newCard.innerHTML = createPhotoCard(photoCount - 1);
            albumGrid.appendChild(newCard.firstElementChild);
            updatePhotoCount();
            showNotification('New memory slot added! ➕');
        }

        // Notification System
        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');

            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Update Photo Count
        function updatePhotoCount() {
            let count = 0;
            for (let i = 0; i < photoCount; i++) {
                const img = document.getElementById(`photo${i}`);
                if (img && img.style.display !== 'none' && img.src) {
                    count++;
                }
            }
            document.getElementById('photoCount').textContent = count;
        }

        // Enhanced Particle System
        function createParticle() {
            const particlesContainer = document.getElementById('particlesContainer');
            const particle = document.createElement('div');
            particle.className = 'particle';

            const types = ['heart', 'petal', 'sparkle'];
            const type = types[Math.floor(Math.random() * types.length)];

            if (type === 'heart') {
                particle.classList.add('heart');
                const hearts = ['❤️', '💕', '💖', '💗', '💝'];
                particle.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
            } else if (type === 'petal') {
                particle.classList.add('petal');
                particle.style.transform = `rotate(${Math.random() * 360}deg)`;
            } else {
                particle.classList.add('sparkle');
                particle.innerHTML = '✨';
            }

            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (Math.random() * 8 + 7) + 's';
            particle.style.animationDelay = Math.random() * 5 + 's';

            particlesContainer.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, 18000);
        }

        // Generate particles continuously
        setInterval(createParticle, 500);

        // Initialize
        initializeAlbum();

        // Auto-save every 30 seconds
        setInterval(saveToLocalStorage, 30000);

        // Initial particle burst
        for (let i = 0; i < 20; i++) {
            setTimeout(createParticle, i * 150);
        }
    </script>
</body>
